<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction History</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #2c3e50;
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f9f9f9;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .back-btn:hover {
            background-color: #2980b9;
        }
        .cell-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }
        .badge-lymp { background-color: #ffeaa7; color: #d63031; }
        .badge-eos { background-color: #fab1a0; color: #d63031; }
        .badge-mono { background-color: #74b9ff; color: #0984e3; }
        .badge-neut { background-color: #55efc4; color: #00b894; }
    </style>
</head>
<body>

<div class="container">
    <a href="/" class="back-btn">← Back to Home</a>
    <h1>Blood Cell Classification History</h1>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Image Name</th>
                <th>Predicted Cell Type</th>
                <th>Confidence</th>
                <th>Date & Time</th>
            </tr>
        </thead>
        <tbody>
            {% for record in records %}
            <tr>
                <!-- Fixed explicit array indices for safe Jinja template processing -->
                <td>{{ record[0] }}</td>
                <td>{{ record[1] }}</td>
                <td>
                    <span class="cell-badge 
                        {% if record[2] == 'LYMPHOCYTE' %}badge-lymp
                        {% elif record[2] == 'EOSINOPHIL' %}badge-eos
                        {% elif record[2] == 'MONOCYTE' %}badge-mono
                        {% else %}badge-neut{% endif %}">
                        {{ record[2] }}
                    </span>
                </td>
                <td>{{ record[3] }}%</td>
                <td>{{ record[4] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
