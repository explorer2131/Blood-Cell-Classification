<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prediction Result</title>
</head>

<body>

    <h1>Prediction Result</h1>

    <img
        src="{{ url_for('static', filename='uploads/' + image) }}"
        width="300"
    >

    <h2>{{ prediction }}</h2>

    <p>
        Confidence: {{ confidence }}%
    </p>

    <br>

    <a href="/">
        Predict Another Image
    </a>

</body>

</html>
