<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Cell Classification</title>
    <style>
        /* Base Page Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Glassmorphism Container Card */
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Advanced File Upload Dropzone Wrapper */
        .file-upload-wrapper {
            position: relative;
            border: 2px dashed #3498db;
            border-radius: 10px;
            padding: 30px 20px;
            background-color: #f8fafc;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-upload-wrapper:hover {
            background-color: #f0f4f8;
            border-color: #2980b9;
        }

        .file-upload-wrapper p {
            margin: 0;
            color: #34495e;
            font-size: 15px;
            font-weight: 500;
        }

        /* Hiding default ugly input button */
        .file-upload-wrapper input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* Live Image Preview Window */
        #preview-container {
            margin-top: 20px;
            display: none;
            justify-content: center;
        }

        #image-preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Premium Flat Design Buttons */
        .btn-submit {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 25px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px rgba(46, 204, 113, 0.2);
        }

        .btn-submit:hover {
            background-color: #27ae60;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-history {
            display: inline-block;
            margin-top: 20px;
            color: #3498db;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .btn-history:hover {
            color: #2980b9;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Blood Cell AI Classifier</h1>
        <p class="subtitle">Upload a microscopic image to identify WBC type with deep learning</p>

        <form action="/predict" method="POST" enctype="multipart/form-data">
            
            <!-- Styled Upload Wrapper -->
            <div class="file-upload-wrapper">
                <p id="upload-text">📁 Click here to select image</p>
                <input 
                    type="file" 
                    name="image" 
                    accept="image/*" 
                    required
                    onchange="previewImage(event)"
                >
            </div>

            <!-- Live Preview Window -->
            <div id="preview-container">
                <img id="image-preview" src="#" alt="Selected Image Preview">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">
                Run Diagnostic Predict
            </button>

        </form>

        <!-- Dynamic Database History Route Redirect Button -->
        <a href="/history" class="btn-history">📊 View Prediction Database History</a>
    </div>

    <!-- JavaScript for Live Image Preview Name Mapping -->
    <script>
        function previewImage(event) {
            const input = event.target;
            const uploadText = document.getElementById('upload-text');
            const previewContainer = document.getElementById('preview-container');
            const previewImage = document.getElementById('image-preview');

            if (input.files && input.files[0]) {
                const file = input.files[0];
                
                // Show file name inside dropzone wrapper
                uploadText.textContent = `Selected: ${file.name}`;
                
                // Read and set live preview image
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImage.src = e.target.result;
                    previewContainer.style.display = 'flex';
                }
                reader.readAsDataURL(file);
            }
        }
    </script>

</body>

</html>
